# Production-like stack (TRD §1). Database, Auth and Storage are remote Supabase (.env).
# Dev overrides with watch mode live in compose.dev.yaml — use `make dev`.

services:
  api:
    build:
      context: ./backend
      target: api
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      target: web
      args:
        API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis-data:
